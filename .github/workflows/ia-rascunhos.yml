name: Rascunhos por IA
# Quando data/eventos-pendentes.json muda (ou à mão): a IA rascunha título, introdução e "como chegar"
# em PT/EN/ES com fontes, em radar/rascunhos-ia.md. O evento só vai ao site quando alguém copia a
# entrada revisada para data/eventos.json.
on:
  push:
    branches: [main]
    paths: ["data/eventos-pendentes.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ia-rascunhos
  cancel-in-progress: false
jobs:
  rascunhos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rascunhar eventos pendentes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python scripts/ia_rascunhos.py
      - name: Guardar os rascunhos
        run: |
          git config user.name "rascunho-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radar/rascunhos-ia.md data/rascunhos-ia.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sem novidade."; else
            git commit -m "Rascunhos por IA para revisão"
            git pull --rebase -q || true
            git push
          fi
