name: Radar de menções
# Uma vez por dia: procura quem está perguntando sobre os eventos do site em conversas públicas e
# monta radar/fila.md (uma resposta a escrever por conversa) e radar/inteligencia.md (o que as pessoas
# perguntam, onde, e o que produzir por causa disso). Ele nunca publica nada: quem responde é uma pessoa.
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Varrer as conversas públicas
        env:
          WHATSAPP_CONTATO: ${{ vars.WHATSAPP_CONTATO }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ vars.GOOGLE_CSE_CX }}
          REDDIT_ID: ${{ secrets.REDDIT_ID }}
          REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/radar.py
      - name: Guardar a fila do dia
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radar/fila.md radar/inteligencia.md data/mencoes.json
          if git diff --cached --quiet; then
            echo "Sem novidade na fila."
          else
            git commit -m "Radar de menções: fila do dia"
            git pull --rebase -q || true
            git push
          fi
