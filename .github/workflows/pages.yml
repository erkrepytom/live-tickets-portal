name: Publish Live Tickets
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # o IndexNow compara os sitemaps com o commit anterior
      - name: Conferir o site antes de publicar
        run: python3 scripts/conferir_site.py
      - name: Publicar em mytickets.tours (Azure Static Web Apps)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "."
          skip_app_build: true
          skip_api_build: true
          api_location: "api"   # /api/inscrever (formulário "Avise-me dos jogos"); sem esta linha o deploy apaga a API
      - name: Avisar buscadores (IndexNow) das páginas que mudaram
        continue-on-error: true
        run: python3 scripts/indexnow.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
