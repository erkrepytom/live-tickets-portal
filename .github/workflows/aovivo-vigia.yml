name: Vigia da faixa AO VIVO
# O vigia da faixa AO VIVO. Fica olhando por dentro, de 3 em 3 minutos, por até 5h40, enquanto houver
# jogo na janela; sem evento pela frente, encerra em segundos. Existe porque o agendamento de poucos
# minutos do GitHub atrasa e às vezes simplesmente não dispara neste repositório: por isso o próprio
# vigia chama o turno seguinte ao terminar, e os robôs de preços e de vídeos também o acordam.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: aovivo
  cancel-in-progress: false
jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vigiar as transmissões e publicar a cada mudança
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/aovivo.py --vigiar 340
