name: Atualizar dados esportivos
on:
  schedule:
    - cron: "17 * * * *"   # a cada hora, fora do pico do minuto 0
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/atualiza_dados.py"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar dados.json
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python scripts/atualiza_dados.py
      - name: Publicar se houver mudança
        id: pub
        run: |
          git config user.name "dados-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados.json
          if git diff --cached --quiet; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atualiza notícias e placares"
            git push
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi
      # O push acima usa o token do Actions e não dispara o pages.yml,
      # então o deploy do site é feito aqui mesmo quando os dados mudam.
      - uses: actions/configure-pages@v5
        if: steps.pub.outputs.mudou == 'sim'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pub.outputs.mudou == 'sim'
        with:
          path: .
      - name: Deploy
        id: deployment
        if: steps.pub.outputs.mudou == 'sim'
        uses: actions/deploy-pages@v4
