name: Atualizar dados esportivos
on:
  schedule:
    - cron: "17 * * * *"   # a cada hora, fora do pico do minuto 0
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/atualiza_dados.py", "data/eventos.json"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar cliente do Google Analytics (só se o GA4 estiver configurado)
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        if: env.GA4_PROPERTY_ID != ''
        run: pip install --quiet google-analytics-data==0.18.19
      - name: Gerar dados.json
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS: ${{ secrets.GA4_CREDENTIALS }}
        run: python scripts/atualiza_dados.py
      - name: Publicar se houver mudança
        id: pub
        run: |
          git config user.name "dados-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados.json
          if git diff --cached --quiet; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atualiza notícias e placares"
            git push
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi
      # O push acima usa o token do Actions e não dispara o pages.yml,
      # então o deploy do site é feito aqui mesmo quando os dados mudam.
      - name: Publicar em mytickets.tours (Azure Static Web Apps)
        if: steps.pub.outputs.mudou == 'sim'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "."
          skip_app_build: true
          skip_api_build: true
          api_location: "api"   # /api/inscrever (formulário "Avise-me dos jogos"); sem esta linha o deploy apaga a API
      - uses: actions/configure-pages@v5
        if: steps.pub.outputs.mudou == 'sim'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pub.outputs.mudou == 'sim'
        with:
          path: .
      - name: Deploy
        id: deployment
        if: steps.pub.outputs.mudou == 'sim'
        uses: actions/deploy-pages@v4
