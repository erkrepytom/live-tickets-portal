name: Títulos com IA (Search Console)
# Toda quarta: páginas com CTR abaixo do esperado no Search Console ganham 3 propostas de título e
# descrição em radar/ctr.md. Nada é trocado no site; quem aprova ajusta scripts/conteudo.py.
on:
  schedule:
    - cron: "41 10 * * 3"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ia-ctr
  cancel-in-progress: false
jobs:
  ctr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-auth requests
      - name: Ler Search Console e propor títulos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: python scripts/ia_ctr.py
      - name: Guardar as propostas
        run: |
          git config user.name "ctr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radar/ctr.md
          if git diff --cached --quiet; then echo "Sem novidade."; else
            git commit -m "Títulos com IA: propostas da semana"
            git pull --rebase -q || true
            git push
          fi
